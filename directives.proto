syntax = "proto3";

package cothink.ffi;

enum TaskStatus {
  PENDING = 0;
  RUNNING = 1;
  COMPLETED = 2;
  FAILED = 3;
}

message TaskDirective {
  uint64 task_id = 1;
  string target_module = 2;
  bytes payload = 3;
}

message TaskResponse {
  uint64 task_id = 1;
  TaskStatus status = 2;
  int32 error_code = 3;
  bytes result_data = 4;
}

