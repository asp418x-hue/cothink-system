[package]
edition = "2024"
rust-version = "1.85"
name = "oxiblas-lapack"
version = "0.2.2"
authors = ["COOLJAPAN OU <contact@cooljapan.tech>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "LAPACK operations for OxiBLAS - pure Rust implementation"
readme = "README.md"
keywords = [
    "lapack",
    "linear-algebra",
    "decomposition",
    "eigenvalue",
    "svd",
]
categories = [
    "mathematics",
    "science",
    "algorithms",
]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxiblas"
resolver = "2"

[package.metadata.docs.rs]
all-features = true

[features]
default = [
    "oxiblas-core/std",
    "oxiblas-matrix/std",
]
force-scalar = [
    "oxiblas-core/force-scalar",
    "oxiblas-blas/force-scalar",
]
max-simd-128 = [
    "oxiblas-core/max-simd-128",
    "oxiblas-blas/max-simd-128",
]
max-simd-256 = [
    "oxiblas-core/max-simd-256",
    "oxiblas-blas/max-simd-256",
]
parallel = [
    "rayon",
    "oxiblas-blas/parallel",
    "oxiblas-core/parallel",
]

[lib]
name = "oxiblas_lapack"
path = "src/lib.rs"

[[test]]
name = "lapack_compat"
path = "tests/lapack_compat.rs"

[dependencies.bytemuck]
version = "1.25"
features = ["derive"]

[dependencies.num-complex]
version = "0.4"
features = ["bytemuck"]

[dependencies.num-traits]
version = "0.2"

[dependencies.oxiblas-blas]
version = "0.2.2"

[dependencies.oxiblas-core]
version = "0.2.2"
default-features = false

[dependencies.oxiblas-matrix]
version = "0.2.2"
default-features = false

[dependencies.rayon]
version = "1.12"
optional = true

[lints.clippy]
all = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
