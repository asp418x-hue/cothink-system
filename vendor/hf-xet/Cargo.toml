[package]
edition = "2024"
name = "hf-xet"
version = "1.6.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Client library and tooling for the Hugging Face Xet data storage system."
homepage = "https://github.com/huggingface/xet-core"
readme = "README.md"
keywords = [
    "huggingface",
    "datasets",
    "large-files",
    "deduplication",
    "cloud-storage",
]
categories = [
    "artificial-intelligence",
    "asynchronous",
    "data-structures",
    "filesystem",
]
license = "Apache-2.0"
repository = "https://github.com/huggingface/xet-core"
resolver = "2"

[features]
default = ["rustls-tls"]
elevated_information_level = [
    "xet-client/elevated_information_level",
    "xet-runtime/elevated_information_level",
]
fd-track = [
    "xet-runtime/fd-track",
    "xet-client/fd-track",
    "xet-data/fd-track",
]
