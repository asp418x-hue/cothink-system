    "xet-client/native-tls-vendored",
    "xet-data/native-tls-vendored",
]
no-default-cache = ["xet-runtime/no-default-cache"]
python = [
    "xet-runtime/python",
    "xet-data/python",
    "dep:pyo3",
]
