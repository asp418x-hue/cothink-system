[dependencies.num-complex]
version = "0.4"
features = ["bytemuck"]

[dependencies.num-traits]
version = "0.2"

[dependencies.rayon]
version = "1.12"
optional = true

[dependencies.twofloat]
version = "0.8"
optional = true

[dev-dependencies.criterion]
version = "0.8"
features = ["html_reports"]

[target."cfg(unix)".dependencies.libc]
version = "0.2"
optional = true

[lints.clippy]
all = "warn"

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
