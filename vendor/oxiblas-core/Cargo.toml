[package]
edition = "2024"
rust-version = "1.85"
name = "oxiblas-core"
version = "0.2.2"
authors = ["COOLJAPAN OU <contact@cooljapan.tech>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Core traits and SIMD abstractions for OxiBLAS"
readme = "README.md"
keywords = [
    "blas",
    "lapack",
    "simd",
    "linear-algebra",
    "numerics",
]
categories = [
    "mathematics",
    "science",
    "algorithms",
]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxiblas"
resolver = "2"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
f128 = ["dep:twofloat"]
f16 = ["half"]
force-scalar = []
max-simd-128 = []
max-simd-256 = []
parallel = [
    "rayon",
    "std",
]
std = ["libc"]
sve-nightly = []

[lib]
name = "oxiblas_core"
path = "src/lib.rs"

[[bench]]
name = "blocking"
path = "benches/blocking.rs"
harness = false

[[bench]]
name = "simd"
path = "benches/simd.rs"
harness = false

[dependencies.bytemuck]
version = "1.25"
features = ["derive"]

[dependencies.half]
version = "2.7"
features = [
    "num-traits",
    "bytemuck",
    "num-traits",
    "bytemuck",
]
