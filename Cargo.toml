[package]
name = "cothink-system"
version = "0.1.0"
edition = "2024"
description = "I made this binary to be a multitasking agent-spawning orchestrator that is itself a LLM"

[lib]
name = "cothink_system"
path = "src/lib.rs"

[[bin]]
name = "cothink-system"
path = "src/main.rs"

[[bin]]
name = "classifier"
path = "src/bin/classifier.rs"

[[bin]]
name = "thermal_monitor"
path = "src/bin/thermal_monitor.rs"

[dependencies]
d4rt_rs = "0.1.0"
dart-sys = "4.1.5"
dart-sys-fork = "4.1.1"
deep_causality = "0.15.0"
echidna = "0.15.0"
flutter_rust_bridge = "2.12.0"
flutter_rust_bridge_codegen = "2.12.0"
flutter_rust_bridge_macros = "2.12.0"
grpc = "0.9.0"
hickory-resolver = "0.26.1"
hybrid-array = "0.4.14"
inference = "0.3.0"
litert = "0.2.1"
litert-lm-sys = "0.2.1"
litert-rs = "0.1.2"
litert-sys = "0.2.1"
litertlm = "0.2.1"
llm-tokenizer = "1.6.0"
petgraph = "0.8.3"
serde_json = "1.0.151"
sonic-rs = "0.5.8"
stackalloc = "1.2.2"
subjective-time-expansion = "0.1.2"
termcolor = "1.4.1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net"] }
uniffi-bindgen-dart = "0.1.3"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.cothink]
# Framework API Schema Version compatibility
schema_version = "1.0.0"

[package.metadata.cothink.agent]
# Defines the operational role of this specific crate agent
role = "orchestrator"
capabilities = ["task-routing", "state-validation", "ipc-bridging"]
concurrent_execution_limit = 32

[package.metadata.cothink.interop.go]
# Maps the cross-language interaction boundary with the Go repositories
bridge_protocol = "grpc"
protobuf_definitions = ["proto/agent_contract.proto"]
shared_memory_ipc = true

[package.metadata.cothink.runtime.contracts]
# Execution guardrails for task orchestration validation
strict_mode = true
execution_timeout_ms = 5000
retry_policy = "exponential-backoff"

[package.metadata.generate-rpm]
# The primary target binary destination on the host machine
assets = [
    { source = "target/release/cothink-system", dest = "/usr/bin/cothink-system", mode = "755" }
]
license = "MIT"

# Optional but highly recommended system guardrails for multi-agent framework deployments
[package.metadata.generate-rpm.requires]
# Requires standard Linux shell and process execution capabilities
bash = "*"
libc = "*"
