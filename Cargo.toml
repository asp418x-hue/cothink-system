[package]
name = "cothink-system"
version = "0.1.0"
edition = "2024"

[lib]
name = "cothink_system"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cothink-system"
path = "src/main.rs"

[[bin]]
name = "classifier"
path = "src/bin/classifier.rs"

[[bin]]
name = "thermal_monitor"
path = "src/bin/thermal_monitor.rs"

[dependencies]
datum = "1.1.0"
deep_causality = "0.15.2"
echidna = "0.15.0"
flutter_rust_bridge = "2.13.0"
grpc = "0.9.0"
hickory-resolver = "0.26.1"
hybrid-array = "0.4.14"
inference = "0.3.0"
litert = "0.2.1"
litert-lm-sys = "0.2.1"
litert-rs = "0.1.2"
litert-sys = "0.2.1"
litertlm = "0.2.1"
petgraph = "0.8.3"
rdkafka = "0.39.0"
serde_json = "1.0.151"
sonic-rs = "0.5.8"
stackalloc = "1.2.2"
subjective-time-expansion = "0.1.2"
termcolor = "1.4.1"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "time", "process", "io-util", "net"] }

[profile.release]
debug = true
